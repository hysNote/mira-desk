<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mira · 十种风格对照</title><style>*{box-sizing:border-box}body{font-family:'Microsoft YaHei',sans-serif;margin:0;padding:24px;background:#eeeae1;color:#263c34}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}h1{margin:0 0 6px;font-size:24px;font-weight:500}header p{font-size:12px;margin:0;color:#6a766d}a{color:inherit;text-underline-offset:4px}main{display:grid;grid-template-columns:1fr 1fr;gap:16px}article{min-width:0;background:#fffcf5;border:1px solid #d0d7cc;padding:12px;border-radius:7px}h2{font-size:14px;font-weight:500;margin:0 0 9px;display:flex;justify-content:space-between}h2 a{font-size:11px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}figure{margin:0;min-width:0}img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:3px}figcaption{font-size:10px;color:#72806f;margin:5px 0 0}footer{font-size:11px;margin-top:20px;color:#647162}@media(max-width:800px){main{grid-template-columns:1fr}header{display:block}header>a{display:block;margin-top:12px}}</style><header><div><h1>一张工位 · 十种画风</h1><p>每组左边是开源版，右边是 Mira 的桌面；物件和交互保留，只改变视觉表达。</p></div><a href="/preserved-b/index.html">查看保留的 B 原版 ↗</a></header><main id="gallery"></main><footer>风格算法来源：EdwinjJ1 / personal-website（MIT）。原作者场景仅用于本地对照；Mira 的物件与个人内容沿用自己的版本。</footer><script type="module">import{STYLES}from'./styles.js';document.querySelector('#gallery').innerHTML=STYLES.filter(s=>s.id!=='original').map(s=>`<article id="${s.id}"><h2>${s.name}<a href="/?style=${s.id}">进入这个风格 ↗</a></h2><div class="pair"><figure><img src="style-references/${s.id}.webp" alt="开源版 ${s.name}"><figcaption>开源版</figcaption></figure><figure><img src="assets/styles/${s.id}.webp" alt="Mira ${s.name}"><figcaption>Mira · 同一套桌面物件</figcaption></figure></div></article>`).join('');</script></html>
