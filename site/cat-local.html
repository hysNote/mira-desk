<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>摸摸方块猫 · Mira</title><link rel="stylesheet" href="cat-preview.css"><script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
<style>main{max-width:1100px}.stage{background:#d9ddd2;aspect-ratio:16/9}canvas{display:block;width:100%;height:100%;touch-action:pan-y}.stage.desk{background:url('assets/cat-library/desk-clean.webp') center/100% 100%}.stage.close-view{aspect-ratio:auto;height:min(50vw,470px);min-height:290px}.stage canvas{cursor:default}.stage[data-hit=true] canvas{cursor:grab}.stage[data-playing=true] canvas{cursor:default}.note a{text-decoration:underline}.beats span[data-active=true]{color:#304e3f;font-weight:bold}.embedded header,.embedded .intro{display:none}.embedded main{padding:10px}.embedded .stage.close-view{height:275px;min-height:240px}.embedded .note{font-size:10px}.embedded .transport{margin:12px 0}.embedded .transport button{min-width:0;padding:8px 12px}.embedded .views{margin:0 0 10px}.embedded .beats{font-size:10px}.views{margin-bottom:12px}.stage:not(.close-view) #motion-status{font-size:10px}@media(max-width:700px){.stage.desk{min-height:0}.stage.desk .clay-label{display:none}.transport{gap:6px}.transport button{min-width:0}}</style></head><body>
<header><a href="index.html">mira ↗</a><span>一只窝在桌上的方块猫</span><a class="back" href="cat-library.html">保留的 A / B 版 ↗</a></header>
<main><div class="intro"><div><p class="eyebrow">MIRA'S LITTLE DESK COMPANION</p><h1>摸一下，醒一小会儿。</h1><p>趴着休息 → 起身舔毛 → 慢慢趴回去。</p></div></div>
<div class="views"><button id="close-view" aria-pressed="true">模型近景</button><button id="desk-view" aria-pressed="false">放在书桌上</button></div>

<p class="note">这只是为你的书桌重新制作的方块猫。模型和动作都在本地，无需注册或登录。原来的桌面和 A / B 版仍然保留；之后再根据你家猫的照片调整花色。</p><p id="load-error" role="alert" hidden>猫咪暂时没加载出来，请刷新重试。</p></main><script type="module" src="cat-local.js"></script></body></html>
